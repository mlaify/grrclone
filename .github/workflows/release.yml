name: Release

# Tag pushes only.
#
# Deliberately not `pull_request`: this job has access to the signing certificate and
# the notarisation key, and a pull request from a fork must never be able to run a
# workflow that can read them. Tags can only be pushed by someone with write access.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (workflow_dispatch only)"
        required: true

permissions:
  contents: write       # to create the release and upload the DMG
  id-token: write       # to get the OIDC token Sigstore signs the attestation with
  attestations: write   # to record the provenance against this repository

jobs:
  release:
    name: Build, sign, notarise
    runs-on: macos-15
    # Signing secrets are exposed to this job, so pin it to an environment. That lets
    # required reviewers gate it, and keeps the secrets out of every other workflow.
    environment: release
    env:
      # An absolute path ending in .keychain-db. `security` creates exactly this file,
      # and every tool — including notarytool, which resolves a bare name relative to
      # the working directory — accepts it unchanged.
      KEYCHAIN: ${{ github.workspace }}/grrclone-signing.keychain-db

    steps:
      # The dispatch input is validated before it reaches `ref:` or any shell. Only
      # someone with write access can trigger this, so it is not an untrusted-input
      # problem in the usual sense — but a workflow holding signing secrets should not
      # interpolate a free-text field into a git ref or a command line regardless.
      - name: Resolve and validate the tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9A-Za-z._-]+$'; then
            echo "::error::refusing to build tag '$TAG'; expected v<version>"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # Pinned to a commit, not a tag. A tag is mutable: whoever controls the
      # action's repository can move v4 to different code, and this job can read
      # the signing certificate and the notarisation key. Dependabot keeps the SHA
      # current and the trailing comment says which version it is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      # A tag is just a label; nothing else ties it to what the app reports as its
      # version. Without this, tagging v0.2.0 publishes a release whose About box,
      # Finder Get Info and crash reports all still say 0.1.0 — and the only thing
      # standing between the project and that is remembering an undocumented manual
      # edit to project.yml. Fail here instead, where it is cheap and obvious.
      - name: Check the app version matches the tag
        run: |
          set -euo pipefail
          # v0.2.0 and v0.2.0-rc1 must both correspond to MARKETING_VERSION 0.2.0:
          # the pre-release suffix belongs to the tag, not to the bundle version.
          WANTED="${TAG#v}"
          WANTED="${WANTED%%-*}"
          ACTUAL=$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' \
                     App/project.yml | head -1)
          if [ -z "$ACTUAL" ]; then
            echo "::error::could not read MARKETING_VERSION from App/project.yml"
            exit 1
          fi
          if [ "$WANTED" != "$ACTUAL" ]; then
            echo "::error::tag $TAG expects MARKETING_VERSION $WANTED, but App/project.yml says $ACTUAL."
            echo "::error::Update MARKETING_VERSION in App/project.yml and re-tag."
            exit 1
          fi
          echo "version $ACTUAL matches tag $TAG"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the app icon
        run: |
          set -o pipefail
          swift scripts/make-icon.swift
          iconutil -c icns build/AppIcon.iconset -o App/grrclone/Resources/AppIcon.icns

      - name: Cache the bundled rclone
        id: rclone-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: App/grrclone/Resources/rclone
          key: rclone-universal-${{ hashFiles('scripts/fetch-rclone.sh') }}

      - name: Fetch the bundled rclone
        if: steps.rclone-cache.outputs.cache-hit != 'true'
        run: scripts/fetch-rclone.sh

      # An ephemeral keychain, deleted in the always() step below. Importing into the
      # runner's default keychain would leave the private key sitting in the image
      # cache if the job failed before cleanup.
      - name: Import the signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$CERTIFICATE_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # macOS cannot read a PKCS#12 with a SHA-256 MAC, which is OpenSSL 3's
          # default, and reports it as a wrong password. Say so plainly rather than
          # letting someone chase a password that was never the problem.
          MAC=$(openssl pkcs12 -in /tmp/cert.p12 -info -noout -passin pass:x 2>&1 \
                  | grep -iE '^MAC:' || true)
          echo "certificate bundle $MAC"
          case "$MAC" in
            *sha256*)
              echo "::error::This .p12 uses a SHA-256 MAC and macOS cannot import it."
              echo "::error::Regenerate with scripts/export-p12.sh and update MACOS_CERTIFICATE_P12."
              exit 1 ;;
          esac

          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a UI prompt that nobody can answer and the
          # job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          rm -f /tmp/cert.p12
          security find-identity -v -p codesigning | grep "Developer ID Application"

      - name: Store notarisation credentials
        env:
          API_KEY: ${{ secrets.APPSTORE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER }}
        run: |
          set -euo pipefail
          echo "$API_KEY" | base64 --decode > /tmp/AuthKey.p8
          xcrun notarytool store-credentials AC_NOTARY \
            --key /tmp/AuthKey.p8 --key-id "$API_KEY_ID" --issuer "$API_ISSUER" \
            --keychain "$KEYCHAIN"
          rm -f /tmp/AuthKey.p8

      # The same script used locally, so a release from CI and a release from a laptop
      # are the same artefact produced the same way.
      - name: Build, sign, notarise, staple
        env:
          GRRCLONE_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY_SHA1 }}
          # notarytool looks in the default keychain for a stored profile; ours is in
          # the throwaway one, so release.sh has to be told where to find it.
          GRRCLONE_NOTARY_KEYCHAIN: ${{ env.KEYCHAIN }}
        run: scripts/release.sh

      - name: Verify as a downloaded file would be
        run: |
          set -euo pipefail
          cp build/grrclone.dmg /tmp/dl.dmg
          # The attribute Gatekeeper actually reacts to. Without it spctl assesses a
          # local file and can pass something a real download would not.
          xattr -w com.apple.quarantine "0083;00000000;Safari;" /tmp/dl.dmg
          spctl -a -vvv -t open --context context:primary-signature /tmp/dl.dmg
          xcrun stapler validate /tmp/dl.dmg

      # Provenance, recorded in a public transparency log.
      #
      # Produces a Sigstore-signed in-toto SLSA statement binding this exact DMG's
      # SHA-256 to the repository, commit, workflow and runner that produced it, and
      # logs it to Rekor. Anyone can check it without trusting us:
      #
      #     gh attestation verify grrclone.dmg --repo mlaify/grrclone
      #
      # This is not a substitute for notarisation, which is what Gatekeeper enforces.
      # It answers a different question: notarisation says Apple scanned a build
      # signed by our Developer ID, this says which commit and workflow built it.
      #
      # Runs *before* publishing, against the same file the publish step uploads, so
      # the digest attested is by construction the digest released. Attesting after
      # publication would leave a window in which the two could differ.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/grrclone.dmg

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A tag carrying a pre-release suffix is published as one, so it does not
          # become the "Latest" download people land on. Without this an -rc or -beta
          # tag is presented to everyone as the current release.
          PRERELEASE=""
          case "$TAG" in
            *-rc*|*-alpha*|*-beta*) PRERELEASE="--prerelease" ;;
          esac

          gh release create "$TAG" build/grrclone.dmg \
            --title "grrclone ${TAG#v}" \
            --generate-notes \
            --verify-tag \
            $PRERELEASE || \
          gh release upload "$TAG" build/grrclone.dmg --clobber

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true
