name: CodeQL

# Advanced setup, not the default one, for a reason that was measured rather than
# assumed.
#
# Default setup analyses Swift with autobuild, and autobuild builds only the SwiftPM
# targets. Everything under App/grrclone — the entire UI, the keychain store, the
# configuration password prompt — went unscanned while the badge stayed green.
#
# Proved with a canary: identical cleartext-password-into-UserDefaults code was placed
# in a SwiftPM target and in the app target on one branch. CodeQL flagged the SwiftPM
# one (swift/cleartext-storage-preferences, high) and said nothing about the app one.
# Same code, same rule, one scanned and one invisible.
#
# So the Swift database is built here with the project's own build, which is the only
# way the app target ends up in it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds old code without waiting for a commit.
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      security-events: write   # to upload results
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: swift
            build-mode: manual

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Everything the Swift build needs, prepared BEFORE CodeQL initialises.
      #
      # Order is load-bearing. codeql-action/init sets DYLD_INSERT_LIBRARIES to its
      # build tracer, and under that, Homebrew runs as x86_64 and refuses to install
      # into the ARM prefix: "Cannot install under Rosetta 2 in ARM default prefix".
      # Preparing first also keeps Homebrew's own compilation out of the database,
      # which should contain this project and nothing else.
      - name: Install XcodeGen
        if: matrix.language == 'swift'
        run: brew install xcodegen

      # The icon and the bundled rclone are generated rather than committed, and
      # XcodeGen's optional:true does not save you: the copy-resources phase still
      # runs and xcodebuild fails without them.
      - name: Generate the app icon
        if: matrix.language == 'swift'
        run: |
          set -o pipefail
          swift scripts/make-icon.swift
          iconutil -c icns build/AppIcon.iconset -o App/grrclone/Resources/AppIcon.icns
          test -s App/grrclone/Resources/AppIcon.icns

      - name: Cache the bundled rclone
        if: matrix.language == 'swift'
        id: rclone-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: App/grrclone/Resources/rclone
          key: rclone-universal-${{ hashFiles('scripts/fetch-rclone.sh') }}

      - name: Fetch the bundled rclone
        if: matrix.language == 'swift' && steps.rclone-cache.outputs.cache-hit != 'true'
        run: scripts/fetch-rclone.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # Both halves of the project, deliberately. The SwiftPM build alone is what
      # autobuild was already doing, and the app target is the part that was missing.
      - name: Build for analysis
        if: matrix.language == 'swift'
        shell: bash
        run: |
          set -euo pipefail

          # This job runs under Rosetta, and that is CodeQL's doing, not ours.
          #
          # The Swift extractor traces the build by injecting
          # codeql/tools/osx64/libtrace.dylib through DYLD_INSERT_LIBRARIES. That
          # dylib is x86_64, and injecting it translates the whole process tree:
          # measured here as `architecture=x86_64 translated=1`. There is no way to
          # trace a Swift build natively on a macOS runner today, so the choice is
          # between analysing Swift and not analysing it.
          #
          # This is confined to analysis. ci.yml and release.yml build natively and
          # release.yml verifies the shipped slices with lipo, so nothing translated
          # reaches a user. What is analysed is the same source either way.
          #
          # Revisit when GitHub ships an arm64 Swift extractor. Rosetta is removed in
          # macOS 28, so this will stop working for everyone, not only for us, and it
          # is worth checking each time the CodeQL action is bumped.
          echo "architecture=$(uname -m) translated=$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)"

          swift build
          ( cd App && xcodegen generate >/dev/null )
          xcodebuild -project App/grrclone.xcodeproj -scheme grrclone \
            -configuration Debug -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build

          # Architecture is asserted in ci.yml and release.yml, which build the
          # artefact people actually run. Asserting it here would only describe the
          # translated analysis build, which ships nowhere.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          category: "/language:${{ matrix.language }}"
