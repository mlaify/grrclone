name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly published queries reach existing code rather than only new code.
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: swift
          queries: security-and-quality

      # `arch -arm64` is required here but not in ci.yml: the CodeQL tracer runs this
      # job under Rosetta, and Homebrew refuses to install into the ARM prefix from an
      # x86_64 process ("Cannot install under Rosetta 2 in ARM default prefix").
      - name: Install XcodeGen
        run: arch -arm64 brew install xcodegen

      # Built explicitly rather than with autobuild. Autobuild compiles the SwiftPM
      # manifest, which covers Sources/ but not App/grrclone — those files belong only
      # to the generated Xcode project, so the entire app layer would go unscanned.
      - name: Build everything CodeQL should see
        run: |
          set -o pipefail
          swift build
          cd App && arch -arm64 xcodegen generate && cd ..
          xcodebuild -project App/grrclone.xcodeproj -scheme grrclone \
            -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > /dev/null

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"
