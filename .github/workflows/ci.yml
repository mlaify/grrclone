name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ hashFiles('Sources/**/*.swift') }}
          restore-keys: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-

      # Some tests drive the real rclone binary — config encryption runs
      # `rclone config encryption set` and answers its prompts. That is deliberate:
      # the thing under test is the interaction with rclone, and a stub would test
      # the stub.
      #
      # It does not violate the rule below. Those tests spawn a short-lived command;
      # they do not start a daemon or mount anything, and the hermetic check still
      # proves it.
      - name: Cache the bundled rclone
        id: rclone-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: App/grrclone/Resources/rclone
          key: rclone-universal-${{ hashFiles('scripts/fetch-rclone.sh') }}

      - name: Fetch the bundled rclone
        if: steps.rclone-cache.outputs.cache-hit != 'true'
        run: scripts/fetch-rclone.sh

      # The core deliberately has no Xcode dependency, so this runs on its own.
      - name: Test the core
        run: swift test --enable-code-coverage

      # These tests must not need a mounted remote or a running rclone. Anything that
      # does lives in grrclonectl instead, because CI has neither.
      - name: Check the suite stayed hermetic
        run: |
          if pgrep -f "rclone rcd" >/dev/null; then
            echo "::error::a test left an rclone daemon running"; exit 1
          fi
          if mount | grep -q "localhost:/"; then
            echo "::error::a test left an NFS mount behind"; exit 1
          fi

  app:
    name: Build the app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      # The icon is generated rather than committed, so CI has to build it — which
      # also means the generator itself is exercised on every run instead of only
      # when someone happens to touch it locally.
      - name: Generate the app icon
        run: |
          set -o pipefail
          swift scripts/make-icon.swift
          iconutil -c icns build/AppIcon.iconset -o App/grrclone/Resources/AppIcon.icns
          test -s App/grrclone/Resources/AppIcon.icns

      # Keyed on the pinned version inside the fetch script, so the cache is
      # invalidated by bumping rclone and never by anything else.
      - name: Cache the bundled rclone
        id: rclone-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: App/grrclone/Resources/rclone
          key: rclone-universal-${{ hashFiles('scripts/fetch-rclone.sh') }}

      # Fetched rather than stubbed. XcodeGen's optional:true keeps spec validation
      # happy when the binary is absent, but the copy-resources phase still runs and
      # xcodebuild fails with "lstat(.../rclone): No such file or directory". Fetching
      # it also means CI builds the app that actually ships, and exercises the
      # checksum verification on every cache miss.
      - name: Fetch the bundled rclone
        if: steps.rclone-cache.outputs.cache-hit != 'true'
        run: scripts/fetch-rclone.sh

      # Unsigned: CI has no Developer ID certificate. Release signing is a separate,
      # tag-triggered workflow so that signing secrets never run on pull requests,
      # including ones from forks.
      - name: Build unsigned
        # pipefail so xcodebuild's exit status survives the grep that trims its output.
        # Without it, `| grep ... || true` swallows every build failure, and checking for
        # the .app afterwards is not a substitute: Xcode creates that directory early, so
        # it exists even when the build fails.
        shell: bash
        run: |
          set -o pipefail
          cd App && xcodegen generate && cd ..
          xcodebuild -project App/grrclone.xcodeproj -scheme grrclone \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build \
            | grep -E "(warning|error): |^\*\* BUILD" || BUILD_STATUS=$?
          # grep exits 1 when it matches nothing, which is a clean quiet build.
          if [[ "${BUILD_STATUS:-0}" != "0" && "${BUILD_STATUS:-0}" != "1" ]]; then
            echo "::error::xcodebuild failed with status ${BUILD_STATUS}"; exit 1
          fi
          test -d build/Build/Products/Release/grrclone.app

  privacy:
    name: No phone-home
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # grrclone's central promise is that it contacts nothing but the user's own
      # storage providers. A hard failure, not a review convention. Contributors can
      # run the same script locally before pushing.
      - name: Check privacy guarantees
        run: scripts/check-privacy.sh
