name: Bug report
description: Report a crash, mount problem, or other unexpected behavior in grrclone.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This form is public. Do not include passwords, tokens, `rclone.conf` contents, or private remote, bucket, or folder names.

        A vulnerability in grrclone must be reported privately from the repository's **Security** tab. A bug in rclone itself belongs with the [rclone project](https://github.com/rclone/rclone/issues).
  - type: dropdown
    id: kind
    attributes:
      label: Problem
      options:
        - Crash or hang
        - Remote does not mount, or the Finder volume misbehaves
        - Provider or remote compatibility problem
        - Menu bar or settings problem
        - Installation or update problem
        - Performance problem
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: grrclone version
      description: From the About window, or the release tag or commit you built.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How grrclone was installed
      options:
        - Homebrew cask
        - Release DMG
        - Built from source
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac type
      placeholder: macOS 15.1, Apple Silicon
    validations:
      required: true
  - type: input
    id: rclone
    attributes:
      label: rclone version
      description: The first line of `rclone version`.
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Remote type
      description: The rclone backend, for example S3, Google Drive, SFTP, or WebDAV.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove tokens, passwords, `rclone.conf` contents, and private paths first.
      render: shell
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing open and closed issues for this problem.
          required: true
        - label: This report does not contain credentials, tokens, `rclone.conf` contents, or personal data.
          required: true
