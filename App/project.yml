name: grrclone
options:
  bundleIdPrefix: org.mlaify
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  GrrClone:
    path: ../

targets:
  grrclone:
    type: application
    platform: macOS
    sources:
      - path: grrclone
      # The bundled rclone is fetched by scripts/fetch-rclone.sh and gitignored, so the
      # project must tolerate its absence: a plain `swift test` or a contributor who has
      # not run the fetch script should still build. optional:true does that.
      # Generated by scripts/make-icon.swift and gitignored, like the rclone binary.
      # optional:true so a fresh clone still builds before either has been generated.
      - path: grrclone/Resources/AppIcon.icns
        type: file
        optional: true
        buildPhase: resources
      - path: grrclone/Resources/rclone
        type: file
        optional: true
        buildPhase: resources
    dependencies:
      - package: GrrClone
        product: GrrCloneCore
      - package: GrrClone
        product: RcloneRC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mlaify.grrclone
        PRODUCT_NAME: grrclone
        MARKETING_VERSION: "0.6.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: grrclone/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: grrclone/Resources/grrclone.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.10"
        COMBINE_HIDPI_IMAGES: YES
        # Universal, so Intel Macs are supported. rclone must be lipo'd to match.
        ARCHS: "$(ARCHS_STANDARD)"
        # The app spawns a bundled rclone and shells /sbin/mount, neither of which the
        # App Sandbox permits. Distribution is Developer ID, where sandboxing is optional.
        ENABLE_APP_SANDBOX: NO
